name: Check and publish Quickdash

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickdash-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install the native Python library
        run: python3 -m pip install -e .
      - name: Run public checks (same command as local development)
        run: python3 -m tests.check
      - name: Check the installed package without Node on PATH
        run: |
          python3 -m pip wheel . --wheel-dir "$RUNNER_TEMP/quickdash-wheels"
          python3 -m venv "$RUNNER_TEMP/quickdash-package"
          "$RUNNER_TEMP/quickdash-package/bin/python" -m pip install --no-index \
            --find-links "$RUNNER_TEMP/quickdash-wheels" oellm-quickdash
          cd "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/quickdash-package/bin" \
            "$RUNNER_TEMP/quickdash-package/bin/quickdash" "$GITHUB_WORKSPACE/examples/scores.csv" \
            --catalogue "$GITHUB_WORKSPACE/configs/examples/catalogue.yaml" \
            --weights "$GITHUB_WORKSPACE/configs/examples/weights.yaml" \
            --compare 'Example A' 'Example B' --format json > quickdash-installed.json
          PATH="$RUNNER_TEMP/quickdash-package/bin" \
            "$RUNNER_TEMP/quickdash-package/bin/quickdash" "$GITHUB_WORKSPACE/examples/sample-evals.csv" \
            --catalogue "$GITHUB_WORKSPACE/configs/catalogue.yaml" \
            --weights "$GITHUB_WORKSPACE/configs/weights/oellm.yaml" \
            --eval-set "$GITHUB_WORKSPACE/configs/sets/any-available.yaml" \
            --format json > quickdash-installed-sample.json
      - name: Build shared results and the fictional demo
        run: |
          python3 -m app.build --results-dir results --sample-csv examples/sample-evals.csv \
            --output output/shared > "$RUNNER_TEMP/quickdash-shared.json"
          python3 -m app.build examples/scores.csv --catalogue configs/examples/catalogue.yaml \
            --weights configs/examples/weights.yaml --eval-set configs/examples/eval-set.yaml \
            --output output/demo > "$RUNNER_TEMP/quickdash-demo.json"
          mkdir -p output/site
          cp output/shared/index.html output/site/index.html
          cp output/demo/index.html output/site/demo.html
          cp LICENSE app/vendor/js-yaml.LICENSE output/site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: output/site
          retention-days: 30
      - name: Explain PR preview publishing
        if: github.event_name == 'pull_request'
        run: |
          echo 'The Pages publisher will reconcile this build after checks complete. A **Pages preview** check links the deployed page from the PR.' >> "$GITHUB_STEP_SUMMARY"
